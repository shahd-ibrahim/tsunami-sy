      <stop offset='50%' stop-color='#203a43'/>
      <stop offset='100%' stop-color='#2c5364'/>
    </linearGradient>
    <linearGradient id='gold' x1='0%' y1='0%' x2='100%' y2='0%'>
      <stop offset='0%' stop-color='#d4af37'/>
