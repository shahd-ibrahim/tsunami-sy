  </defs>
  <rect width='600' height='380' rx='20' fill='url(#cardBg)' stroke='#d4af37' stroke-width='2'/>
  <rect x='15' y='15' width='570' height='350' rx='14' fill='none' stroke='rgba(212,175,55,0.2)' stroke-width='1' stroke-dasharray='4,4'/>
  
